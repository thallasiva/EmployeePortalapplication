
name: HRMS Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hrms-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  EC2_INSTANCE_ID: i-096a4e0222f41d26b

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=true npm test -- --watchAll=false

      - name: Build frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/

      - name: Package backend
        run: |
          tar -czf backend.tar.gz \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.git \
            -C backend .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend.tar.gz

  deploy-frontend:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload to S3
        run: |
          aws s3 sync build/ "s3://${{ vars.FRONTEND_BUCKET }}/"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  deploy-backend:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download backend
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Configure AWS OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload backend artifact
        run: |
          aws s3 cp backend.tar.gz \
            "s3://${{ vars.DEPLOY_BUCKET }}/deploy-artifacts/${GITHUB_SHA}/backend.tar.gz"

      - name: Trigger EC2 deployment
        run: |
          aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo Backend artifact uploaded for ${GITHUB_SHA}" \
            --comment "HRMS backend release ${GITHUB_SHA}"
