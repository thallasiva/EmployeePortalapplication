
name: HRMS Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: hrms-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  EC2_INSTANCE_ID: i-096a4e0222f41d26b

jobs:

  # --------------------------------
  # 1. TEST AND BUILD
  # --------------------------------
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=true npm test -- --watchAll=false

      - name: Build frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          if-no-files-found: error

      - name: Package backend
        run: |
          tar -czf backend.tar.gz \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.git \
            -C backend .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend.tar.gz
          if-no-files-found: error

  # --------------------------------
  # 2. DEPLOY FRONTEND
  # --------------------------------
  deploy-frontend:
    name: Deploy Frontend
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build/

      - name: Validate AWS role ARN
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::Missing AWS_DEPLOY_ROLE_ARN in production environment secrets."
            exit 1
          fi

          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::Invalid AWS IAM role ARN."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsFrontendDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload frontend to S3
        run: |
          aws s3 sync build/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  # --------------------------------
  # 3. DEPLOY BACKEND
  # --------------------------------
  deploy-backend:
    name: Deploy Backend
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build

      - name: Validate AWS role ARN
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "::error::Missing AWS_DEPLOY_ROLE_ARN in production environment secrets."
            exit 1
          fi

          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo "::error::Invalid AWS IAM role ARN."
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsBackendDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload backend artifact to S3
        run: |
          aws s3 cp backend.tar.gz \
            "s3://${{ vars.DEPLOY_BUCKET }}/deploy-artifacts/${GITHUB_SHA}/backend.tar.gz"

      - name: Trigger EC2 deployment
        run: |
          aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["echo Backend artifact uploaded for ${GITHUB_SHA}"]' \
            --comment "HRMS backend release ${GITHUB_SHA}"
