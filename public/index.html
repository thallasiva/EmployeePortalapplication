<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f18200" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />

    <!-- ── Security meta tags ─────────────────────────────────────────────── -->
    <!--
      CSP is intentionally omitted from this meta tag.
      Reason: meta-tag CSP cannot use runtime env vars (like REACT_APP_API_URL),
      so 'connect-src self' would block cross-origin API calls in development.
      In production, set the Content-Security-Policy as an HTTP response header
      from your web server (nginx/Apache/CDN) so the API origin can be injected
      at deploy time. The Express backend already sends CSP via Helmet for its
      own responses.
    -->
    <!-- Prevent MIME-type sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Block framing (clickjacking prevention) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <!-- Referrer: only send origin to same-site requests -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Disable browser features not needed by this app -->
    <meta http-equiv="Permissions-Policy"
          content="camera=(), microphone=(), geolocation=(), payment=()" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ── Google Fonts: Inter (body) + Plus Jakarta Sans (headings) ──────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet" />

    <title>HRMS</title>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
